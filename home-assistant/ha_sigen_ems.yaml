# Sigenergy Remote EMS: manual scripts, kill switch, EMHASS → limit automation.
# Site entities (rendered from config/site.env): SIGEN_PLANT_SLUG
# EMS mode strings: input_select.* (synced from select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode)

input_boolean:
  emhass_auto_control_master:
    name: EMHASS auto control master
    icon: mdi:robot-industrial
  emhass_recovery_active:
    name: EMHASS SOC recovery active
    icon: mdi:battery-sync
  emhass_d2_actionable_notified:
    name: EMHASS D2 actionable notified

input_number:
  emhass_max_charge_cap_w:
    name: EMHASS max charge cap
    min: 0
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box
    initial: 9000
  emhass_max_discharge_cap_w:
    name: EMHASS max discharge cap
    min: 0
    max: 15000
    step: 100
    unit_of_measurement: W
    mode: box
    initial: 9000
  emhass_power_threshold_w:
    name: EMHASS batt power threshold
    min: 0
    max: 5000
    step: 50
    unit_of_measurement: W
    mode: box
    initial: 500
  emhass_recovery_charge_w:
    name: EMHASS recovery charge setpoint
    min: 0
    max: 15000
    step: 50
    unit_of_measurement: W
    mode: box
  emhass_soc_target:
    name: EMHASS SOC target (fraction)
    min: 0.1
    max: 0.9
    step: 0.05
    mode: box
    initial: 0.6
  emhass_d2_failure_count:
    name: EMHASS D2 failure count
    min: 0
    max: 2
    step: 1
    mode: box
    initial: 0

input_text:
  emhass_d2_failure_signature:
    name: EMHASS D2 failure signature
    max: 255

input_select:
  # Options from select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode (HA REST, 2026-05-23)
  emhass_ems_mode_charge:
    name: Sigen EMS mode (charge)
    options: &sigen_ems_mode_options
      - "PCS remote control"
      - "Standby"
      - "Maximum Self-consumption (Default)"
      - "Command Charging (Consume power from the grid first)"
      - "Command Charging (Consume power from the PV first)"
      - "Command Discharging (Output power from PV first)"
      - "Command Discharging (Output power from the battery first)"
    initial: "Command Charging (Consume power from the grid first)"
  emhass_ems_mode_discharge:
    name: Sigen EMS mode (discharge)
    options: *sigen_ems_mode_options
    initial: "Command Discharging (Output power from the battery first)"
  emhass_ems_mode_idle:
    name: Sigen EMS mode (idle)
    options: *sigen_ems_mode_options
    initial: "Standby"
  emhass_ems_mode_native:
    name: Sigen EMS mode (native fallback)
    options: *sigen_ems_mode_options
    initial: "Maximum Self-consumption (Default)"

input_datetime:
  emhass_last_limit_write:
    name: EMHASS last Sigen limit write
    has_date: true
    has_time: true
  emhass_d2_last_failure:
    name: EMHASS D2 last failure
    has_date: true
    has_time: true

script:
  sigen_set_ems_mode:
    alias: Sigen set Remote EMS mode
    mode: single
    fields:
      mode:
        description: charge, discharge, or idle
        selector:
          select:
            options:
              - charge
              - discharge
              - idle
    sequence:
      - variables:
          option: >
            {% if mode == 'charge' %}
              {{ states('input_select.emhass_ems_mode_charge') }}
            {% elif mode == 'discharge' %}
              {{ states('input_select.emhass_ems_mode_discharge') }}
            {% else %}
              {{ states('input_select.emhass_ems_mode_idle') }}
            {% endif %}
      - service: select.select_option
        target:
          entity_id: select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode
        data:
          option: "{{ option }}"

  sigen_apply_charge_limits:
    alias: Sigen apply charge power limit
    description: Run script.sigen_set_ems_mode (charge) first; wait until mode updates before this script.
    mode: queued
    fields:
      watts:
        description: Power cap in watts (converted to kW for Sigen number entities)
        selector:
          number:
            min: 0
            max: 15000
            step: 50
            unit_of_measurement: W
    sequence:
      - variables:
          requested_kw: "{{ [0, (watts | float(0) / 1000)] | max | round(2) }}"
          device_max_kw: >-
            {{ state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
               | float(0) }}
          limit_kw: >-
            {{ [requested_kw | float(0), device_max_kw | float(0)] | min | round(2) }}
      - service: number.set_value
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_charging_limit
        data:
          value: "{{ limit_kw }}"
      - service: number.set_value
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit
        data:
          value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_last_limit_write
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  sigen_apply_discharge_limits:
    alias: Sigen apply discharge power limit
    mode: queued
    fields:
      watts:
        description: Power cap in watts (converted to kW for Sigen number entities)
        selector:
          number:
            min: 0
            max: 15000
            step: 50
            unit_of_measurement: W
    sequence:
      - variables:
          requested_kw: "{{ [0, (watts | float(0) / 1000)] | max | round(2) }}"
          device_max_kw: >-
            {{ state_attr('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit', 'max')
               | float(0) }}
          limit_kw: >-
            {{ [requested_kw | float(0), device_max_kw | float(0)] | min | round(2) }}
      - service: number.set_value
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit
        data:
          value: "{{ limit_kw }}"
      - service: number.set_value
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_charging_limit
        data:
          value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_last_limit_write
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  sigen_apply_idle_limits:
    alias: Sigen idle limits (both zero)
    mode: queued
    sequence:
      - service: number.set_value
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_charging_limit
        data:
          value: 0
      - service: number.set_value
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit
        data:
          value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_last_limit_write
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  sigen_restore_native_control:
    alias: Sigen restore native control
    description: >-
      Return control to native Maximum Self-consumption, restore device-valid
      operator limits, and record success only after Sigenergy confirms both phases.
    mode: restart
    fields:
      reason:
        description: Context that requested native control restoration
        default: unknown
        selector:
          text:
    sequence:
      - variables:
          native_mode: "{{ states('input_select.emhass_ems_mode_native') }}"
          charge_cap_kw: >-
            {{ [0, (states('input_number.emhass_max_charge_cap_w')
                      | float(0) / 1000)] | max | round(2) }}
          discharge_cap_kw: >-
            {{ [0, (states('input_number.emhass_max_discharge_cap_w')
                      | float(0) / 1000)] | max | round(2) }}
      - service: select.select_option
        continue_on_error: true
        target:
          entity_id: select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode
        data:
          option: "{{ native_mode }}"
      - wait_template: >-
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {{ is_state('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode', native_mode)
             and states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') not in bad
             and states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') not in bad
             and (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
                  | float(0)) > 0
             and (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit', 'max')
                  | float(0)) > 0 }}
        timeout: "00:01:15"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - variables:
              phase: native_mode_confirmation
              signature: "{{ reason ~ '|' ~ phase }}"
              master_state: "{{ states('input_boolean.emhass_auto_control_master') }}"
              mode_state: "{{ states('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode') }}"
              charge_state: "{{ states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') }}"
              discharge_state: "{{ states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') }}"
              previous_signature: "{{ states('input_text.emhass_d2_failure_signature') }}"
              previous_count: "{{ states('input_number.emhass_d2_failure_count') | int(0) }}"
              previous_ts: >-
                {{ state_attr('input_datetime.emhass_d2_last_failure', 'timestamp')
                   | float(0) }}
              control_failure_reasons: "{{ ['stale_plan', 'bad_optim'] }}"
              fallback_unconfirmed: >-
                {% set bad = ['unknown', 'unavailable', 'none', ''] %}
                {{ not (
                     is_state('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode', native_mode)
                     and states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') not in bad
                     and states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') not in bad
                     and (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
                          | float(0)) > 0
                     and (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit', 'max')
                          | float(0)) > 0
                   ) }}
          - variables:
              same_context: >-
                {{ previous_signature == signature
                   and previous_ts > 0
                   and (as_timestamp(now()) - previous_ts) <= 10 * 60 }}
              next_count: >-
                {{ [2, (previous_count + 1) if (
                     previous_signature == signature
                     and previous_ts > 0
                     and (as_timestamp(now()) - previous_ts) <= 10 * 60
                   ) else 1] | min }}
              state_message: >-
                reason={{ reason }}, confirmation_phase={{ phase }},
                master={{ master_state }}, mode={{ mode_state }},
                charge_limit={{ charge_state }} kW,
                discharge_limit={{ discharge_state }} kW.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ reason in control_failure_reasons
                         and master_state == 'on'
                         and fallback_unconfirmed
                         and same_context
                         and previous_count == 1
                         and not is_state(
                               'input_boolean.emhass_d2_actionable_notified', 'on') }}
                sequence:
                  - service: script.emhass_push_alert
                    data:
                      title: "EMHASS D2: Native fallback unconfirmed"
                      message: >-
                        Action: Check Sigenergy mode, limit entities, and sigenergy2mqtt.
                        Second same-context timeout within 10 minutes;
                        {{ state_message }}
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.emhass_d2_actionable_notified
                  - service: input_text.set_value
                    target:
                      entity_id: input_text.emhass_d2_failure_signature
                    data:
                      value: "{{ signature }}"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.emhass_d2_failure_count
                    data:
                      value: "{{ next_count }}"
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.emhass_d2_last_failure
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - service: script.emhass_log_event
                    continue_on_error: true
                    data:
                      incident_id: D2
                      phase: actionable
                      message: "{{ state_message }}"
                      action: Check Sigenergy mode, limit entities, and sigenergy2mqtt.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ reason in control_failure_reasons
                         and master_state == 'on'
                         and fallback_unconfirmed
                         and same_context
                         and (previous_count >= 2
                              or is_state(
                                   'input_boolean.emhass_d2_actionable_notified',
                                   'on')) }}
                sequence:
                  - service: script.emhass_log_event
                    continue_on_error: true
                    data:
                      incident_id: D2
                      phase: suppressed
                      message: >-
                        Duplicate phone notification suppressed for
                        signature={{ signature }}; {{ state_message }}
                      action: Check the existing D2 actionable event.
            default:
              - service: script.emhass_log_event
                continue_on_error: true
                data:
                  incident_id: D2
                  phase: recovering
                  message: "{{ state_message }}"
                  action: Monitor native fallback confirmation.
              - service: input_text.set_value
                target:
                  entity_id: input_text.emhass_d2_failure_signature
                data:
                  value: "{{ signature }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_d2_failure_count
                data:
                  value: "{{ next_count }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.emhass_d2_last_failure
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - stop: "Native fallback mode confirmation failed"
            error: true
      - variables:
          charge_device_max_kw: >-
            {{ state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
               | float(0) }}
          discharge_device_max_kw: >-
            {{ state_attr('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit', 'max')
               | float(0) }}
          charge_target_kw: >-
            {{ [charge_cap_kw | float(0), charge_device_max_kw | float(0)]
               | min | round(2) }}
          discharge_target_kw: >-
            {{ [discharge_cap_kw | float(0), discharge_device_max_kw | float(0)]
               | min | round(2) }}
      - service: number.set_value
        continue_on_error: true
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_charging_limit
        data:
          value: "{{ charge_target_kw }}"
      - service: number.set_value
        continue_on_error: true
        target:
          entity_id: number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit
        data:
          value: "{{ discharge_target_kw }}"
      - wait_template: >-
          {% set charge_actual_kw =
               states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') | float(none) %}
          {% set discharge_actual_kw =
               states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') | float(none) %}
          {{ charge_actual_kw is not none
             and discharge_actual_kw is not none
             and ((charge_actual_kw - (charge_target_kw | float(0))) | abs) <= 0.02
             and ((discharge_actual_kw - (discharge_target_kw | float(0))) | abs) <= 0.02 }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - variables:
              phase: limit_confirmation
              signature: "{{ reason ~ '|' ~ phase }}"
              master_state: "{{ states('input_boolean.emhass_auto_control_master') }}"
              mode_state: "{{ states('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode') }}"
              charge_state: "{{ states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') }}"
              discharge_state: "{{ states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') }}"
              previous_signature: "{{ states('input_text.emhass_d2_failure_signature') }}"
              previous_count: "{{ states('input_number.emhass_d2_failure_count') | int(0) }}"
              previous_ts: >-
                {{ state_attr('input_datetime.emhass_d2_last_failure', 'timestamp')
                   | float(0) }}
              fallback_unconfirmed: >-
                {% set charge_actual_kw =
                     states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') | float(none) %}
                {% set discharge_actual_kw =
                     states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') | float(none) %}
                {{ charge_actual_kw is none
                   or discharge_actual_kw is none
                   or ((charge_actual_kw - (charge_target_kw | float(0))) | abs) > 0.02
                   or ((discharge_actual_kw - (discharge_target_kw | float(0))) | abs) > 0.02 }}
          - variables:
              same_context: >-
                {{ previous_signature == signature
                   and previous_ts > 0
                   and (as_timestamp(now()) - previous_ts) <= 10 * 60 }}
              next_count: >-
                {{ [2, (previous_count + 1) if (
                     previous_signature == signature
                     and previous_ts > 0
                     and (as_timestamp(now()) - previous_ts) <= 10 * 60
                   ) else 1] | min }}
              state_message: >-
                reason={{ reason }}, confirmation_phase={{ phase }},
                master={{ master_state }}, mode={{ mode_state }},
                charge_limit={{ charge_state }} kW (target={{ charge_target_kw }}),
                discharge_limit={{ discharge_state }} kW (target={{ discharge_target_kw }}).
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ reason in ['stale_plan', 'bad_optim']
                         and master_state == 'on'
                         and fallback_unconfirmed
                         and same_context
                         and previous_count == 1
                         and not is_state(
                               'input_boolean.emhass_d2_actionable_notified', 'on') }}
                sequence:
                  - service: script.emhass_push_alert
                    data:
                      title: "EMHASS D2: Native fallback limits unconfirmed"
                      message: >-
                        Action: Check Sigenergy limit entities and sigenergy2mqtt.
                        Second same-context timeout within 10 minutes;
                        {{ state_message }}
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.emhass_d2_actionable_notified
                  - service: input_text.set_value
                    target:
                      entity_id: input_text.emhass_d2_failure_signature
                    data:
                      value: "{{ signature }}"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.emhass_d2_failure_count
                    data:
                      value: "{{ next_count }}"
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.emhass_d2_last_failure
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - service: script.emhass_log_event
                    continue_on_error: true
                    data:
                      incident_id: D2
                      phase: actionable
                      message: "{{ state_message }}"
                      action: Check Sigenergy limit entities and sigenergy2mqtt.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ reason in ['stale_plan', 'bad_optim']
                         and master_state == 'on'
                         and fallback_unconfirmed
                         and same_context
                         and (previous_count >= 2
                              or is_state(
                                   'input_boolean.emhass_d2_actionable_notified',
                                   'on')) }}
                sequence:
                  - service: script.emhass_log_event
                    continue_on_error: true
                    data:
                      incident_id: D2
                      phase: suppressed
                      message: >-
                        Duplicate phone notification suppressed for
                        signature={{ signature }}; {{ state_message }}
                      action: Check the existing D2 actionable event.
            default:
              - service: script.emhass_log_event
                continue_on_error: true
                data:
                  incident_id: D2
                  phase: recovering
                  message: "{{ state_message }}"
                  action: Monitor native fallback confirmation.
              - service: input_text.set_value
                target:
                  entity_id: input_text.emhass_d2_failure_signature
                data:
                  value: "{{ signature }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.emhass_d2_failure_count
                data:
                  value: "{{ next_count }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.emhass_d2_last_failure
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - stop: "Native fallback limit confirmation failed"
            error: true
      - variables:
          resolved_signature: "{{ states('input_text.emhass_d2_failure_signature') }}"
          resolved_count: "{{ states('input_number.emhass_d2_failure_count') | int(0) }}"
          resolved_notified: >-
            {{ is_state('input_boolean.emhass_d2_actionable_notified', 'on') }}
      - if:
          - condition: template
            value_template: >-
              {{ resolved_signature != '' or resolved_count > 0 or resolved_notified }}
        then:
          - service: script.emhass_log_event
            continue_on_error: true
            data:
              incident_id: D2
              phase: resolved
              message: >-
                Native mode and limits confirmed after signature={{ resolved_signature }};
                master={{ states('input_boolean.emhass_auto_control_master') }},
                mode={{ states('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode') }},
                charge_limit={{ states('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit') }} kW,
                discharge_limit={{ states('number.__SIGEN_PLANT_SLUG___plant_max_discharging_limit') }} kW.
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.emhass_d2_actionable_notified
          - service: input_text.set_value
            target:
              entity_id: input_text.emhass_d2_failure_signature
            data:
              value: ""
          - service: input_number.set_value
            target:
              entity_id: input_number.emhass_d2_failure_count
            data:
              value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.emhass_last_limit_write
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  sigen_disable_remote_ems:
    alias: Sigen disable Remote EMS control
    description: Restore limits and set self-consumption mode when master is turned off.
    mode: restart
    fields:
      reason:
        description: Context that requested Remote EMS disable
        default: master_off
        selector:
          text:
    sequence:
      - service: script.sigen_restore_native_control
        data:
          reason: "{{ reason }}"

  sigen_clear_recovery:
    alias: Sigen clear EMHASS SOC recovery
    mode: restart
    sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.emhass_recovery_active
      - service: input_number.set_value
        target:
          entity_id: input_number.emhass_recovery_charge_w
        data:
          value: 0

  sigen_start_recovery:
    alias: Sigen start EMHASS SOC recovery
    mode: restart
    sequence:
      - variables:
          plan_charge_w: "{{ states('sensor.emhass_batt_charge_power_w') | float(0) }}"
          operator_cap_w: "{{ states('input_number.emhass_max_charge_cap_w') | float(0) }}"
          device_cap_w: >-
            {{ (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
                | float(0) * 1000) | round(0) }}
          charge_limit_w: >-
            {{ [plan_charge_w | float(0), operator_cap_w | float(0),
                device_cap_w | float(0)] | min | round(0) }}
      - condition: template
        value_template: >-
          {{ charge_limit_w | float(0)
             >= states('input_number.emhass_power_threshold_w') | float(500) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.emhass_recovery_charge_w
        data:
          value: "{{ charge_limit_w }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.emhass_recovery_active
      - service: script.sigen_set_ems_mode
        data:
          mode: charge
      - service: script.sigen_apply_charge_limits
        data:
          watts: "{{ charge_limit_w }}"
      - service: logbook.log
        data:
          name: EMHASS EMS
          entity_id: sensor.__SIGEN_PLANT_SLUG___plant_battery_soc
          message: >-
            Fresh EMHASS charge command started SOC recovery at
            {{ charge_limit_w }} W until
            {{ states('sensor.emhass_recovery_target_soc') }}%.

  sigen_apply_active_recovery:
    alias: Sigen reconcile active EMHASS SOC recovery
    mode: restart
    sequence:
      - variables:
          stored_w: "{{ states('input_number.emhass_recovery_charge_w') | float(0) }}"
          operator_cap_w: "{{ states('input_number.emhass_max_charge_cap_w') | float(0) }}"
          device_cap_w: >-
            {{ (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
                | float(0) * 1000) | round(0) }}
          charge_limit_w: >-
            {{ [stored_w | float(0), operator_cap_w | float(0),
                device_cap_w | float(0)] | min | round(0) }}
      - service: script.sigen_set_ems_mode
        data:
          mode: charge
      - service: script.sigen_apply_charge_limits
        data:
          watts: "{{ charge_limit_w }}"

  sigen_apply_emhass_plan:
    alias: Sigen apply EMHASS p_batt_forecast to limits
    description: >-
      Negative p_batt_forecast = charge; positive = discharge (EMHASS sign).
      Discharge branch includes SOC headroom clamp to prevent overshoot below floor.
      Requires binary_sensor.emhass_control_allowed.
    mode: single
    sequence:
      - variables:
          threshold: "{{ states('input_number.emhass_power_threshold_w') | float(500) }}"
          p: "{{ states('sensor.p_batt_forecast') | float(0) }}"
          charge_w: "{{ states('sensor.emhass_batt_charge_power_w') | float(0) }}"
          discharge_w: "{{ states('sensor.emhass_batt_discharge_power_w') | float(0) }}"
          max_chg: "{{ states('input_number.emhass_max_charge_cap_w') | float(9000) }}"
          max_dis: "{{ states('input_number.emhass_max_discharge_cap_w') | float(9000) }}"
          soc: "{{ states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(50) }}"
          # SOC headroom clamp: max discharge watts that keep SOC above floor
          min_soc_frac: "{{ states('input_number.emhass_soc_min') | float(5) / 100 }}"
          capacity_wh: 19000
          eta_dis: 0.95
          step_h: 0.5
          headroom_wh: "{{ [0, (soc / 100 - min_soc_frac) * capacity_wh * eta_dis] | max }}"
          max_by_soc_w: "{{ (headroom_wh / step_h) | round(0) }}"
          charge_limit: "{{ [charge_w, max_chg] | min | round(0) }}"
          # Discharge capped by plan, user cap, AND SOC headroom
          discharge_limit: "{{ [discharge_w, max_dis, max_by_soc_w] | min | round(0) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ p < (0 - threshold) and soc < 100 }}"
            sequence:
              - service: script.sigen_set_ems_mode
                data:
                  mode: charge
              - service: script.sigen_apply_charge_limits
                data:
                  watts: "{{ charge_limit }}"
          - conditions:
              - condition: template
                # Headroom clamp may reduce discharge_limit below threshold → idle
                value_template: "{{ p > threshold and discharge_limit >= threshold and soc > min_soc_frac * 100 }}"
            sequence:
              - service: script.sigen_set_ems_mode
                data:
                  mode: discharge
              - service: script.sigen_apply_discharge_limits
                data:
                  watts: "{{ discharge_limit }}"
          - conditions:
              - condition: template
                value_template: "{{ p >= (0 - threshold) and p <= threshold }}"
            sequence:
              - service: script.sigen_restore_native_control
                data:
                  reason: idle
        default:
          - service: script.sigen_restore_native_control
            data:
              reason: idle

automation:
  - id: emhass_sigen_kill_switch_off
    alias: EMHASS Sigen — kill switch disables Remote EMS
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.emhass_auto_control_master
        from: "on"
        to: "off"
    action:
      - service: script.sigen_clear_recovery
      - service: script.sigen_disable_remote_ems
        data:
          reason: master_off

  - id: emhass_sigen_enforce_master_off
    alias: EMHASS Sigen — enforce master off after start or reconnect
    mode: restart
    trigger:
      - id: command_mode
        platform: state
        entity_id: select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode
        to:
          - "Command Discharging (Output power from PV first)"
          - "Command Discharging (Output power from the battery first)"
          - "Command Charging (Consume power from the grid first)"
      - id: reconnect
        platform: state
        entity_id: select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode
        from:
          - "unknown"
          - "unavailable"
      - id: ha_start
        platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.emhass_auto_control_master
        state: "off"
      - condition: template
        value_template: >-
          {{ trigger.id in ['reconnect', 'ha_start']
             or states('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode') in [
                  'Command Discharging (Output power from PV first)',
                  'Command Discharging (Output power from the battery first)',
                  'Command Charging (Consume power from the grid first)'
                ] }}
    action:
      - service: script.sigen_disable_remote_ems
        data:
          reason: startup_or_reconnect

  - id: emhass_sigen_apply_plan_scheduled
    alias: EMHASS Sigen — apply actionable plan
    description: Applies completed or newly enabled plans, with a safe 5-minute retry
    mode: single
    trigger:
      - id: plan_completed
        platform: state
        entity_id: input_datetime.emhass_last_successful_mpc
      - id: control_enabled
        platform: state
        entity_id: binary_sensor.emhass_control_allowed
        to: "on"
      - id: retry
        platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >-
          {{ trigger.id != 'retry'
             or now().minute not in [0, 30] }}
      - condition: state
        entity_id: binary_sensor.emhass_control_allowed
        state: "on"
      - condition: state
        entity_id: input_boolean.emhass_recovery_active
        state: "off"
      - condition: template
        value_template: >
          {% set last_ts = state_attr('input_datetime.emhass_last_limit_write', 'timestamp') | float(0) %}
          {% if last_ts <= 0 %}
            true
          {% else %}
            {{ (as_timestamp(now()) - last_ts) >= 300 }}
          {% endif %}
    action:
      - service: script.sigen_apply_emhass_plan

  - id: emhass_sigen_disable_on_stale_plan
    alias: EMHASS Sigen — disable when plan stale with master on
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.emhass_control_allowed
        from: "on"
        to: "off"
        for:
          minutes: 1
    condition:
      - condition: state
        entity_id: input_boolean.emhass_auto_control_master
        state: "on"
      - condition: state
        entity_id: input_boolean.emhass_recovery_active
        state: "off"
      - condition: template
        value_template: "{{ state_attr('binary_sensor.emhass_control_allowed', 'block_reason') != 'soc_below_floor' }}"
    action:
      - service: script.emhass_log_event
        data:
          incident_id: D2
          phase: detected
          message: >-
            Stale-plan fallback requested; master={{
            states('input_boolean.emhass_auto_control_master') }},
            block_reason={{
            state_attr('binary_sensor.emhass_control_allowed', 'block_reason') }}.
          action: Monitor native fallback confirmation.
      - service: script.sigen_restore_native_control
        data:
          reason: stale_plan

  - id: emhass_sigen_disable_on_bad_optim
    alias: EMHASS Sigen — disable when optim not Optimal
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.optim_status
        not_to:
          - "unknown"
          - "unavailable"
    condition:
      - condition: state
        entity_id: input_boolean.emhass_auto_control_master
        state: "on"
      - condition: state
        entity_id: input_boolean.emhass_recovery_active
        state: "off"
      - condition: template
        value_template: "{{ not is_state('sensor.optim_status', 'Optimal') }}"
    action:
      - service: script.emhass_log_event
        data:
          incident_id: D2
          phase: detected
          message: >-
            Bad-optim fallback requested; optim_status={{
            states('sensor.optim_status') }}, master={{
            states('input_boolean.emhass_auto_control_master') }}.
          action: Check EMHASS logs and monitor native fallback confirmation.
      - service: script.sigen_restore_native_control
        data:
          reason: bad_optim

  # --- SOC floor enforcement (Layer 2) ---

  - id: emhass_soc_floor_cutout
    alias: "EMHASS SOC floor cutout — stop discharge at min SOC"
    description: >-
      Real-time safety net: immediately stops discharge when SOC crosses the floor,
      without waiting for the next :00/:30 apply cycle.
    mode: restart
    trigger:
      - platform: template
        value_template: >-
          {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
          {% set min_soc = states('input_number.emhass_soc_min') | float(5) %}
          {{ soc is not none and 0 <= soc <= min_soc }}
      - platform: state
        entity_id: select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode
        to:
          - "Command Discharging (Output power from PV first)"
          - "Command Discharging (Output power from the battery first)"
    condition:
      - condition: template
        value_template: >-
          {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
          {% set min_soc = states('input_number.emhass_soc_min') | float(5) %}
          {{ soc is not none and 0 <= soc <= min_soc }}
      - condition: template
        value_template: >-
          {{ states('select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode')
             in ['Command Discharging (Output power from PV first)',
                 'Command Discharging (Output power from the battery first)'] }}
    action:
      - service: script.turn_off
        target:
          entity_id:
            - script.sigen_apply_emhass_plan
            - script.sigen_restore_native_control
            - script.sigen_set_ems_mode
            - script.sigen_apply_discharge_limits
      - service: script.sigen_restore_native_control
        data:
          reason: soc_floor
      - service: logbook.log
        data:
          name: "EMHASS EMS"
          entity_id: sensor.__SIGEN_PLANT_SLUG___plant_battery_soc
          message: >-
            SOC {{ states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') }}% hit floor
            ({{ states('input_number.emhass_soc_min') }}%). Command discharge stopped; restored native self-consumption.

  # --- Recovery charging (Layer 3) ---

  - id: emhass_recovery_start
    alias: "EMHASS recovery — latch fresh charge plan below SOC floor"
    description: >-
      Wait below the SOC floor for a fresh EMHASS charge instruction, then store
      its capped setpoint and keep recovery active until the configured target.
    mode: single
    trigger:
      - id: mpc_fresh
        platform: state
        entity_id: binary_sensor.emhass_mpc_fresh
        to: "on"
      - id: plan_changed
        platform: state
        entity_id: sensor.p_batt_forecast
      - id: floor_crossed
        platform: numeric_state
        entity_id: sensor.__SIGEN_PLANT_SLUG___plant_battery_soc
        below: input_number.emhass_soc_min
      - id: retry
        platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.emhass_auto_control_master
        state: "on"
      - condition: state
        entity_id: input_boolean.emhass_recovery_active
        state: "off"
      - condition: template
        value_template: >-
          {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
          {{ soc is not none and 0 <= soc <= 100 }}
      - condition: numeric_state
        entity_id: sensor.__SIGEN_PLANT_SLUG___plant_battery_soc
        below: input_number.emhass_soc_min
      - condition: state
        entity_id: binary_sensor.emhass_mpc_fresh
        state: "on"
      - condition: template
        value_template: >-
          {% set p = states('sensor.p_batt_forecast') | float(0) %}
          {% set threshold = states('input_number.emhass_power_threshold_w') | float(500) %}
          {{ p < (0 - threshold) }}
      - condition: template
        value_template: >-
          {{ (state_attr('number.__SIGEN_PLANT_SLUG___plant_max_charging_limit', 'max')
              | float(0)) > 0 }}
      - condition: template
        value_template: >-
          {% set last_ts = state_attr('input_datetime.emhass_last_limit_write', 'timestamp') | float(0) %}
          {{ last_ts <= 0 or (as_timestamp(now()) - last_ts) >= 300 }}
    action:
      - service: script.sigen_start_recovery

  - id: emhass_recovery_reconcile
    alias: "EMHASS recovery — reconcile active charge until target"
    description: >-
      Reapply a stored recovery command after reconnects, stop at the configured
      target, and cancel safely on master-off or sustained invalid SOC.
    mode: restart
    trigger:
      - id: periodic
        platform: time_pattern
        minutes: "/5"
      - id: target_reached
        platform: template
        value_template: >-
          {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
          {% set target = states('sensor.emhass_recovery_target_soc') | float(none) %}
          {{ soc is not none
             and target is not none
             and 0 <= soc <= 100
             and soc >= target }}
      - id: target_changed
        platform: state
        entity_id: sensor.emhass_recovery_target_soc
      - id: master_changed
        platform: state
        entity_id: input_boolean.emhass_auto_control_master
      - id: invalid_soc
        platform: template
        value_template: >-
          {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
          {{ soc is none or soc < 0 or soc > 100 }}
        for: "00:02:00"
      - id: reconnect
        platform: state
        entity_id: select.__SIGEN_PLANT_SLUG___plant_remote_ems_control_mode
        from:
          - "unknown"
          - "unavailable"
      - id: ha_start
        platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.emhass_recovery_active
        state: "on"
    action:
      - variables:
          soc: "{{ states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) }}"
          target: "{{ states('sensor.emhass_recovery_target_soc') | float(100) }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.emhass_auto_control_master
                state: "off"
            sequence:
              - service: script.sigen_clear_recovery
              - service: script.sigen_restore_native_control
                data:
                  reason: recovery
              - service: logbook.log
                data:
                  name: EMHASS EMS
                  message: "SOC recovery cancelled because master control is off."
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'invalid_soc' }}"
            sequence:
              - service: script.sigen_clear_recovery
              - service: script.sigen_restore_native_control
                data:
                  reason: recovery
              - service: logbook.log
                data:
                  name: EMHASS EMS
                  message: "SOC recovery cancelled because SOC was invalid for two minutes."
          - conditions:
              - condition: template
                value_template: "{{ soc is not none and 0 <= soc <= 100 and soc >= target }}"
            sequence:
              - service: script.sigen_clear_recovery
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: binary_sensor.emhass_control_allowed
                        state: "on"
                    sequence:
                      - service: script.sigen_apply_emhass_plan
                default:
                  - service: script.sigen_restore_native_control
                    data:
                      reason: recovery
              - service: logbook.log
                data:
                  name: EMHASS EMS
                  entity_id: sensor.__SIGEN_PLANT_SLUG___plant_battery_soc
                  message: >-
                    SOC {{ soc }}% reached recovery target {{ target }}%; recovery
                    cleared and normal control reconciled immediately.
        default:
          - condition: template
            value_template: >-
              {% set last_ts = state_attr('input_datetime.emhass_last_limit_write', 'timestamp') | float(0) %}
              {{ trigger.id in ['reconnect', 'ha_start']
                 or last_ts <= 0
                 or (as_timestamp(now()) - last_ts) >= 300 }}
          - condition: template
            value_template: "{{ soc is not none and 0 <= soc < target }}"
          - service: script.sigen_apply_active_recovery
