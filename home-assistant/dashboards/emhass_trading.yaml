title: EMHASS & Sigen
views:
  - title: Trading
    path: emhass-trading
    icon: mdi:solar-power-variant-outline
    cards:
      - type: entities
        title: Status
        entities:
          - entity: sensor.optim_status
          - entity: binary_sensor.emhass_plan_valid
          - entity: binary_sensor.emhass_plan_problem
          - entity: binary_sensor.emhass_control_allowed
          - entity: input_boolean.emhass_auto_control_master
          - entity: input_select.emhass_ems_mode_native
          - entity: input_number.emhass_soc_min
          - entity: input_number.emhass_soc_max
          - entity: sensor.emhass_recovery_target_soc
          - entity: sensor.__SIGEN_PLANT_SLUG___plant_battery_soc
          - entity: sensor.__SIGEN_PLANT_SLUG___plant_battery_power
          - entity: __P1_POWER_NET_ENTITY__
            name: P1 grid net (+ import, − export)
          - entity: sensor.emhass_plan_active_step
          - type: attribute
            entity: binary_sensor.emhass_control_allowed
            attribute: p_batt_age_min
            name: Plan age (min)


      - type: entities
        title: Prices
        entities:
          - entity: sensor.unit_load_cost
          - entity: sensor.unit_prod_price
          - entity: sensor.emhass_price_rank_now
          - entity: sensor.emhass_net_electricity_profit_today
            name: Net profit today
          - entity: sensor.emhass_net_electricity_profit_month
            name: Net profit this month

      - type: statistics-graph
        title: Net electricity profit — last 7 days
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
          - state
        entities:
          - entity: sensor.emhass_net_electricity_profit_today
            name: Net profit (EUR)

      - type: entities
        title: Actual (Sigen / P1)
        entities:
          - entity: sensor.emhass_house_load_power_w
            name: Derived house load
          - entity: __P1_POWER_CONSUMPTION_ENTITY__
            name: P1 gross import
          - entity: __P1_POWER_PRODUCTION_ENTITY__
            name: P1 gross export
          - entity: sensor.net_electricity_today
            name: P1 net energy today (kWh)

      - type: history-graph
        title: P1 grid/load vs EMHASS plan step (24 h)
        hours_to_show: 24
        entities:
          - entity: __P1_POWER_NET_ENTITY__
          - entity: sensor.p_grid_forecast
          - entity: sensor.emhass_house_load_power_w
          - entity: sensor.p_load_forecast

      - type: custom:apexcharts-card
        header:
          show: true
          title: Plan vs battery (24 h)
          show_states: true
          colorize_states: true
        graph_span: 24h
        yaxis:
          - id: power
            decimals: 0
            apex_config:
              title:
                text: W
        series:
          - entity: sensor.p_batt_forecast
            name: Plan
            type: line
            stroke_width: 2
            yaxis_id: power
            unit: W
          - entity: sensor.__SIGEN_PLANT_SLUG___plant_battery_power
            name: Actual battery (EMHASS sign)
            type: line
            stroke_width: 2
            invert: true
            yaxis_id: power
            unit: W

      # PV actual and forecast
      - type: vertical-stack
        cards:
          - type: statistics-graph
            title: PV actual vs forecast — yesterday and today
            days_to_show: 2
            period: hour
            chart_type: line
            stat_types:
              - mean
            entities:
              - entity: sensor.emhass_pv_power_w
                name: Actual PV (hourly mean)
              - entity: sensor.p_pv_forecast
                name: Forecast PV (hourly mean)

          - type: markdown
            title: Today's PV forecast
            entity_id:
              - sensor.p_pv_forecast
            content: >
              {%- set rows = state_attr('sensor.p_pv_forecast', 'forecasts') or [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set ns = namespace(count=0) -%}
              {%- for row in rows -%}
              {%- if (row.date | string)[:10] == today -%}
              {%- set ns.count = ns.count + 1 -%}
              {%- endif -%}
              {%- endfor -%}
              {%- if ns.count == 0 -%}
              <p><em>No PV forecast rows for today.</em></p>
              {%- else -%}
              <table width="100%">
              <thead><tr><th>Time</th><th align="right">Forecast</th></tr></thead>
              <tbody>
              {%- for row in rows -%}
              {%- if (row.date | string)[:10] == today -%}
              <tr><td>{{ (row.date | string)[11:16] }}</td><td align="right">{{ row.p_pv_forecast | float(0) | round(0) }} W</td></tr>
              {%- endif -%}
              {%- endfor -%}
              </tbody>
              </table>
              {%- endif -%}

      - type: custom:config-template-card
        entities:
          - sensor.zonneplan_current_electricity_tariff
        variables:
          price_span: |
            (() => {
              const rows = states['sensor.zonneplan_current_electricity_tariff'].attributes.forecast || [];
              if (!rows.length) return '30min';
              const last = new Date(rows[rows.length - 1].datetime).getTime();
              // Hourly slots: last datetime is the hour start; include that full hour.
              const end = last + 60 * 60 * 1000;
              const mins = Math.max(30, Math.ceil((end - Date.now()) / 60000));
              return `${mins}min`;
            })()
        card:
          type: custom:apexcharts-card
          header:
            show: true
            title: Import price forecast
            show_states: true
            colorize_states: true
          graph_span: ${price_span}
          span:
            start: minute
          now:
            show: true
            label: now
          yaxis:
            - id: price
              decimals: 2
              apex_config:
                title:
                  text: €/kWh
          series:
            - entity: sensor.zonneplan_current_electricity_tariff
              name: Import
              type: area
              curve: stepline
              stroke_width: 2
              unit: €/kWh
              yaxis_id: price
              float_precision: 2
              extend_to: false
              show:
                in_header: after_now
                extremas: true
                legend_value: false
              data_generator: |
                const now = Date.now();
                return (entity.attributes.forecast || [])
                  .map((row) => [
                    new Date(row.datetime).getTime(),
                    Number(row.electricity_price) / 1e7,
                  ])
                  .filter(([ts, value]) => Number.isFinite(ts) && Number.isFinite(value) && ts >= now - 65 * 60 * 1000);

      - type: markdown
        title: Upcoming plan (MPC horizon)
        entity_id:
          - sensor.p_batt_forecast
          - sensor.p_pv_forecast
          - sensor.p_grid_forecast
          - sensor.soc_batt_forecast
          - sensor.unit_load_cost
        content: >
          {%- set batt = state_attr('sensor.p_batt_forecast', 'battery_scheduled_power') or [] -%}
          {%- set pv_f = state_attr('sensor.p_pv_forecast', 'forecasts') or [] -%}
          {%- set grid_f = state_attr('sensor.p_grid_forecast', 'forecasts') or [] -%}
          {%- set soc_f = state_attr('sensor.soc_batt_forecast', 'battery_scheduled_soc') or [] -%}
          {%- set price_f = state_attr('sensor.unit_load_cost', 'unit_load_cost_forecasts') or [] -%}
          {%- if batt | length == 0 -%}
          <p><em>No plan rows yet — MPC runs at :00 and :30 on the energy host.</em></p>
          {%- else -%}
          <table width="100%">
          <thead>
          <tr>
          <th>From</th>
          <th align="right">PV W</th>
          <th>Battery</th>
          <th>Grid</th>
          <th align="right">SOC %</th>
          <th align="right">€/kWh</th>
          </tr>
          </thead>
          <tbody>
          {%- for row in batt -%}
          {%- set ts = row.date -%}
          {%- set p = row.p_batt_forecast | float(0) -%}
          {%- set ns = namespace(pv='—', gr='—', soc='—', pr='—') -%}
          {%- for x in pv_f %}{% if x.date == ts %}{% set ns.pv = x.p_pv_forecast %}{% endif %}{% endfor -%}
          {%- for x in grid_f %}{% if x.date == ts %}{% set ns.gr = x.p_grid_forecast %}{% endif %}{% endfor -%}
          {%- for x in soc_f %}{% if x.date == ts %}{% set ns.soc = x.soc_batt_forecast %}{% endif %}{% endfor -%}
          {%- for x in price_f %}{% if x.date == ts %}{% set ns.pr = x.unit_load_cost %}{% endif %}{% endfor -%}
          {%- set t = (ts | string)[11:16] -%}
          {%- if p < -500 %}{% set btxt = 'chg ' ~ ((-p) | int) ~ ' W' %}{% elif p > 500 %}{% set btxt = 'dis ' ~ (p | int) ~ ' W' %}{% else %}{% set btxt = 'idle' %}{% endif -%}
          {%- set g = ns.gr | float(none) -%}
          {%- if g is not none and g > 50 %}{% set gtxt = (g | int) ~ ' W in' %}{% elif g is not none and g < -50 %}{% set gtxt = (g | abs | int) ~ ' W out' %}{% elif g is not none %}{% set gtxt = '≈0' %}{% else %}{% set gtxt = '—' %}{% endif -%}
          <tr><td><strong>{{ t }}</strong></td><td align="right">{{ ns.pv }}</td><td>{{ btxt }}</td><td>{{ gtxt }}</td><td align="right">{{ ns.soc }}</td><td align="right">{{ ns.pr }}</td></tr>
          {%- endfor -%}
          </tbody>
          </table>
          <p><small>chg = charge · dis = discharge · W in = grid import · W out = grid export</small></p>
          {%- endif -%}
