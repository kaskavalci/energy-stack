# EMHASS trading observability: templates, optional price freshness, alerts.
# Lovelace UI: dashboards/emhass_trading.yaml (registered in configuration.yaml).

# Optional: enable after SSH from HA to energy host works (see docs/SETUP.md).
# command_line:
#   - sensor:
#       name: EMHASS prices fetched at
#       unique_id: emhass_prices_fetched_at
#       command: >-
#         ssh -i /config/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5
#         ENERGY_REMOTE_HOST from config/site.env
#         cat ENERGY_REMOTE_DIR/emhass/share/prices_fetched_at.txt
#       value_template: "{{ value | trim }}"
#       scan_interval: 3600

template:
  - sensor:
      - name: EMHASS batt charge power
        unique_id: emhass_batt_charge_power_w
        default_entity_id: sensor.emhass_batt_charge_power_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.p_batt_forecast') | float(0) %}
          {{ ([-p, 0] | max) | round(0) }}

      - name: EMHASS batt discharge power
        unique_id: emhass_batt_discharge_power_w
        default_entity_id: sensor.emhass_batt_discharge_power_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.p_batt_forecast') | float(0) %}
          {{ ([p, 0] | max) | round(0) }}

      - name: EMHASS plan active step
        unique_id: emhass_plan_active_step
        default_entity_id: sensor.emhass_plan_active_step
        icon: mdi:timeline-clock
        state: >
          {% set rows = state_attr('sensor.p_batt_forecast', 'battery_scheduled_power') or [] %}
          {% if rows | length == 0 %}
            No plan data
          {% else %}
            {% set r = rows[0] %}
            {% set p = r.p_batt_forecast | float(0) %}
            {% set t0 = (r.date | string)[11:16] %}
            {% set t1 = (rows[1].date | string)[11:16] if rows | length > 1 else "…" %}
            {% if p < -500 %}
              {{ t0 }}–{{ t1 }} · charge {{ (-p) | int }} W
            {% elif p > 500 %}
              {{ t0 }}–{{ t1 }} · discharge {{ p | int }} W
            {% else %}
              {{ t0 }}–{{ t1 }} · idle
            {% endif %}
          {% endif %}

      - name: EMHASS plan schedule
        unique_id: emhass_plan_schedule
        default_entity_id: sensor.emhass_plan_schedule
        icon: mdi:table-clock
        state: >
          {% set batt = state_attr('sensor.p_batt_forecast', 'battery_scheduled_power') or [] %}
          {% if batt | length == 0 %}
            waiting for MPC
          {% else %}
            {{ batt | length }} × 30 min (to {{ (batt[-1].date | string)[11:16] }})
          {% endif %}
        attributes:
          markdown: >
            {% set batt = state_attr('sensor.p_batt_forecast', 'battery_scheduled_power') or [] %}
            {% set pv_f = state_attr('sensor.p_pv_forecast', 'forecasts') or [] %}
            {% set grid_f = state_attr('sensor.p_grid_forecast', 'forecasts') or [] %}
            {% set soc_f = state_attr('sensor.soc_batt_forecast', 'battery_scheduled_soc') or [] %}
            {% set price_f = state_attr('sensor.unit_load_cost', 'unit_load_cost_forecasts') or [] %}
            {% if batt | length == 0 %}
            _No plan rows yet. MPC runs at **:00** and **:30** on the energy host._
            {% else %}
            | From | PV W | Battery | Grid | SOC % | Import €/kWh |
            |:---|---:|:---|:---|---:|---:|
            {% for row in batt %}
            {% set ts = row.date %}
            {% set p = row.p_batt_forecast | float(0) %}
            {% set ns = namespace(pv='—', gr='—', soc='—', pr='—') %}
            {% for x in pv_f %}{% if x.date == ts %}{% set ns.pv = x.p_pv_forecast %}{% endif %}{% endfor %}
            {% for x in grid_f %}{% if x.date == ts %}{% set ns.gr = x.p_grid_forecast %}{% endif %}{% endfor %}
            {% for x in soc_f %}{% if x.date == ts %}{% set ns.soc = x.soc_batt_forecast %}{% endif %}{% endfor %}
            {% for x in price_f %}{% if x.date == ts %}{% set ns.pr = x.unit_load_cost %}{% endif %}{% endfor %}
            {% set t = (ts | string)[11:16] %}
            {% if p < -500 %}{% set btxt = 'chg ' ~ ((-p) | int) ~ ' W' %}{% elif p > 500 %}{% set btxt = 'dis ' ~ (p | int) ~ ' W' %}{% else %}{% set btxt = 'idle' %}{% endif %}
            {% set g = ns.gr | float(none) %}
            {% if g is not none and g > 50 %}{% set gtxt = (g | int) ~ ' W import' %}{% elif g is not none and g < -50 %}{% set gtxt = (g | abs | int) ~ ' W export' %}{% elif g is not none %}{% set gtxt = '≈0' %}{% else %}{% set gtxt = '—' %}{% endif %}
            | **{{ t }}** | {{ ns.pv }} | {{ btxt }} | {{ gtxt }} | {{ ns.soc }} | {{ ns.pr }} |
            {% endfor %}
            _Negative battery = charge · Positive = discharge · Grid import = buy from net._
            {% endif %}
          plan_updated_min: >
            {{ ((now() - states.sensor.p_batt_forecast.last_updated).total_seconds() / 60) | round(0) }}

      - name: EMHASS price rank now
        unique_id: emhass_price_rank_now
        default_entity_id: sensor.emhass_price_rank_now
        icon: mdi:cash-multiple
        state: >
          {% set price = states('sensor.unit_load_cost') | float(none) %}
          {% if price is none %}
            unknown
          {% else %}
            {% set mn = state_attr('sensor.unit_load_cost', 'min') | default(none) %}
            {% set mx = state_attr('sensor.unit_load_cost', 'max') | default(none) %}
            {% if mn is none or mx is none or mx == mn %}
              mid
            {% elif price <= mn + 0.001 %}
              low
            {% elif price >= mx - 0.001 %}
              high
            {% else %}
              mid
            {% endif %}
          {% endif %}

      - name: EMHASS recovery target SOC
        unique_id: emhass_recovery_target_soc
        default_entity_id: sensor.emhass_recovery_target_soc
        unit_of_measurement: "%"
        state: >
          {% set min_soc = states('input_number.emhass_soc_min') | float(5) %}
          {{ [min_soc + 5, 100] | min }}

  - binary_sensor:
      - name: EMHASS MPC fresh
        unique_id: emhass_mpc_fresh
        default_entity_id: binary_sensor.emhass_mpc_fresh
        device_class: running
        state: >
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {% set completed_ts = state_attr('input_datetime.emhass_last_successful_mpc', 'timestamp') | float(0) %}
          {% set age_s = as_timestamp(now()) - completed_ts %}
          {% set pb = states('sensor.p_batt_forecast') %}
          {{ completed_ts > 0
             and age_s >= -5 * 60
             and age_s < 40 * 60
             and pb not in bad
             and (pb | float(none)) is not none
             and is_state('sensor.optim_status', 'Optimal') }}
        attributes:
          reason: >
            {% set bad = ['unknown', 'unavailable', 'none', ''] %}
            {% set completed_ts = state_attr('input_datetime.emhass_last_successful_mpc', 'timestamp') | float(0) %}
            {% set age_s = as_timestamp(now()) - completed_ts %}
            {% set pb = states('sensor.p_batt_forecast') %}
            {% if pb in bad or (pb | float(none)) is none %}
              plan_missing
            {% elif completed_ts <= 0 or age_s < -5 * 60 or age_s >= 40 * 60 %}
              plan_stale
            {% elif not is_state('sensor.optim_status', 'Optimal') %}
              optim_not_optimal
            {% else %}
              ok
            {% endif %}
          age_min: >
            {% set completed_ts = state_attr('input_datetime.emhass_last_successful_mpc', 'timestamp') | float(0) %}
            {{ ((as_timestamp(now()) - completed_ts) / 60) | round(1)
               if completed_ts > 0 else none }}
          last_successful_mpc: "{{ states('input_datetime.emhass_last_successful_mpc') }}"

      - name: EMHASS plan valid
        unique_id: emhass_plan_valid
        default_entity_id: binary_sensor.emhass_plan_valid
        icon: mdi:check-circle
        state: "{{ is_state('binary_sensor.emhass_mpc_fresh', 'on') }}"

      - name: EMHASS plan problem
        unique_id: emhass_plan_problem
        default_entity_id: binary_sensor.emhass_plan_problem
        device_class: problem
        state: "{{ not is_state('binary_sensor.emhass_mpc_fresh', 'on') }}"

      - name: EMHASS control allowed
        unique_id: emhass_control_allowed
        default_entity_id: binary_sensor.emhass_control_allowed
        device_class: running
        state: >
          {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
          {% set min_soc = states('input_number.emhass_soc_min') | float(5) %}
          {% set pf = states('sensor.emhass_prices_fetched_at') %}
          {% set fresh = is_state('binary_sensor.emhass_mpc_fresh', 'on') %}
          {% set fresh_reason = state_attr('binary_sensor.emhass_mpc_fresh', 'reason')
             | default('plan_stale', true) %}
          {% set ns = namespace(reason='ok') %}
          {% if not is_state('input_boolean.emhass_auto_control_master', 'on') %}
            {% set ns.reason = 'master_off' %}
          {% elif soc is none or soc > 100 %}
            {% set ns.reason = 'soc_invalid' %}
          {% elif pf not in ['unknown', 'unavailable', 'none', ''] and (now() - states.sensor.emhass_prices_fetched_at.last_changed).total_seconds() > 26 * 3600 %}
            {% set ns.reason = 'prices_stale' %}
          {% elif not fresh %}
            {% set ns.reason = fresh_reason %}
          {% elif soc < min_soc %}
            {% set ns.reason = 'soc_below_floor' %}
          {% endif %}
          {{ ns.reason == 'ok' }}
        attributes:
          block_reason: >
            {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
            {% set min_soc = states('input_number.emhass_soc_min') | float(5) %}
            {% set pf = states('sensor.emhass_prices_fetched_at') %}
            {% set fresh = is_state('binary_sensor.emhass_mpc_fresh', 'on') %}
            {% set fresh_reason = state_attr('binary_sensor.emhass_mpc_fresh', 'reason')
               | default('plan_stale', true) %}
            {% if not is_state('input_boolean.emhass_auto_control_master', 'on') %}
              master_off
            {% elif soc is none or soc > 100 %}
              soc_invalid
            {% elif pf not in ['unknown', 'unavailable', 'none', ''] and (now() - states.sensor.emhass_prices_fetched_at.last_changed).total_seconds() > 26 * 3600 %}
              prices_stale
            {% elif not fresh %}
              {{ fresh_reason }}
            {% elif soc < min_soc %}
              soc_below_floor
            {% else %}
              ok
            {% endif %}
          block_action: >
            {% set soc = states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') | float(none) %}
            {% set min_soc = states('input_number.emhass_soc_min') | float(5) %}
            {% set pf = states('sensor.emhass_prices_fetched_at') %}
            {% set fresh = is_state('binary_sensor.emhass_mpc_fresh', 'on') %}
            {% set fresh_reason = state_attr('binary_sensor.emhass_mpc_fresh', 'reason')
               | default('plan_stale', true) %}
            {% if not is_state('input_boolean.emhass_auto_control_master', 'on') %}
              Turn on master switch to resume control.
            {% elif soc is none or soc > 100 %}
              Check sigenergy2mqtt battery sensors.
            {% elif pf not in ['unknown', 'unavailable', 'none', ''] and (now() - states.sensor.emhass_prices_fetched_at.last_changed).total_seconds() > 26 * 3600 %}
              Check Zonneplan integration and emhass-cron on energy host.
            {% elif not fresh %}
              {% if fresh_reason == 'plan_missing' %}
                Wait for next MPC run or check energy host.
              {% elif fresh_reason == 'optim_not_optimal' %}
                Check EMHASS logs for solver infeasibility.
              {% else %}
                Check emhass-cron; last successful MPC is older than 40 minutes.
              {% endif %}
            {% elif soc < min_soc %}
              Wait for recovery charge plan.
            {% else %}
              None.
            {% endif %}
          master_on: "{{ is_state('input_boolean.emhass_auto_control_master', 'on') }}"
          optim_status: "{{ states('sensor.optim_status') }}"
          p_batt_forecast: "{{ states('sensor.p_batt_forecast') }}"
          last_successful_mpc: "{{ states('input_datetime.emhass_last_successful_mpc') }}"
          mpc_age_min: "{{ state_attr('binary_sensor.emhass_mpc_fresh', 'age_min') }}"
          battery_soc: "{{ states('sensor.__SIGEN_PLANT_SLUG___plant_battery_soc') }}"
