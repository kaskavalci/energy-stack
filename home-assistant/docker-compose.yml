# Home Assistant Container (Odroid / non-HAOS).
# Deploy path on host: /opt/homeassistant/docker-compose.yml
# Config volume: /opt/homeassistant/config → /config
#
# Requires: deploy user owns the config dir and is in the docker group
# (no interactive sudo). network_mode: host for Envoy/Zeroconf/MQTT discovery.

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    network_mode: host
    # Must match HA time_zone (Europe/Amsterdam). Without this, container stays
    # UTC and as_timestamp() on naive input_datetime strings ages MPC plans ~2h
    # into the future → false plan_stale / control blocked.
    environment:
      TZ: Europe/Amsterdam
    labels:
      # Ignore GHCR .dev / beta tags so WUD only reports real X.Y.Z releases.
      wud.tag.include: '^\d+\.\d+\.\d+$$'
    volumes:
      # Relative to the compose file directory (default: /opt/homeassistant).
      - ./config:/config
    restart: unless-stopped

  wud:
    image: docker.io/getwud/wud:8.3.0@sha256:1cf5ecfdbd2389847427fd9685c4fd337ee8c74a0f584c52288d760d9a58811e
    container_name: wud
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - wud-ha-store:/store
    environment:
      TZ: "${TZ:?config/wud.env must define TZ}"
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_CRON: "0 6 * * *"
      WUD_WATCHER_LOCAL_WATCHALL: "true"
      WUD_TRIGGER_TELEGRAM_HA_BOTTOKEN: "${WUD_TELEGRAM_BOT_TOKEN:?config/wud.env must define WUD_TELEGRAM_BOT_TOKEN}"
      WUD_TRIGGER_TELEGRAM_HA_CHATID: "${WUD_TELEGRAM_CHAT_ID:?config/wud.env must define WUD_TELEGRAM_CHAT_ID}"
      WUD_TRIGGER_TELEGRAM_HA_MESSAGEFORMAT: HTML
      WUD_TRIGGER_TELEGRAM_HA_MODE: batch
      WUD_TRIGGER_TELEGRAM_HA_THRESHOLD: all
      WUD_TRIGGER_TELEGRAM_HA_ONCE: "true"
      WUD_TRIGGER_TELEGRAM_HA_BATCHTITLE: "ha-node: $${count} update(s)"

volumes:
  wud-ha-store:
