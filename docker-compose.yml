services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro

  mqtt4dsmr:
    image: ghcr.io/antonijn/mqtt4dsmr:latest
    container_name: mqtt4dsmr
    restart: unless-stopped
    devices:
      - /dev/ttyUSB0:/dev/ttyDSMR
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto

  sigenergy2mqtt:
    # Floating :latest is intentional (operator override of tag+digest pin policy).
    image: ghcr.io/seud0nym/sigenergy2mqtt:latest
    container_name: sigenergy2mqtt
    restart: unless-stopped
    volumes:
      - ./sigenergy/sigenergy2mqtt.yaml:/data/sigenergy2mqtt.yaml
    depends_on:
      - mosquitto
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      # Persistence connects before YAML load; defaults to 127.0.0.1 otherwise.
      - SIGENERGY2MQTT_MQTT_BROKER=mosquitto
      - SIGENERGY2MQTT_MQTT_ANONYMOUS=true

  emhass:
    # Floating :latest is intentional (operator override of tag+digest pin policy).
    image: ghcr.io/davidusb-geek/emhass:latest
    container_name: emhass
    restart: unless-stopped
    env_file:
      - config/site.env
    ports:
      - "5000:5000"
    volumes:
      - ./emhass/share:/share/
      - ./emhass/share/data_load_cost_forecast.csv:/data/data_load_cost_forecast.csv
      - ./emhass/share/data_prod_price_forecast.csv:/data/data_prod_price_forecast.csv
      - ./emhass/secrets_emhass.yaml:/app/secrets_emhass.yaml:ro
    environment:
      - LOCAL_COSTFUN=profit
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  emhass-cron:
    build:
      context: .
      dockerfile: emhass-cron/Dockerfile
    container_name: emhass-cron
    restart: unless-stopped
    labels:
      wud.watch: "false"
    env_file:
      - config/site.env
    volumes:
      - ./emhass/secrets_emhass.yaml:/secrets/secrets_emhass.yaml:ro
      - ./emhass/share:/share
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - EMAHASS_URL=http://emhass:5000/action/dayahead-optim
      - EMAHASS_SECRETS=/secrets/secrets_emhass.yaml
      - EMAHASS_SHARE=/share
      - EMHASS_CONTAINER=emhass
    depends_on:
      emhass:
        condition: service_healthy

  energy-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: energy-monitor
    restart: unless-stopped
    labels:
      wud.watch: "false"
    env_file:
      - config/site.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./emhass/share:/share
      - ./emhass/secrets_emhass.yaml:/secrets/secrets_emhass.yaml:ro
    environment:
      - EMAHASS_BASE_URL=http://emhass:5000
      - EMAHASS_SECRETS=/secrets/secrets_emhass.yaml
      - EMAHASS_SHARE=/share
      - EMHASS_CONTAINER=emhass
      - HA_NOTIFY_SERVICE=notify.notify
      - ALERT_COOLDOWN_SEC=7200
      - ALERT_FAILURE_THRESHOLD=2
    depends_on:
      emhass:
        condition: service_healthy

  wud:
    image: docker.io/getwud/wud:8.3.0@sha256:1cf5ecfdbd2389847427fd9685c4fd337ee8c74a0f584c52288d760d9a58811e
    container_name: wud
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - wud-energy-store:/store
    environment:
      TZ: "${TZ:?config/wud.env must define TZ}"
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_CRON: "0 6 * * *"
      WUD_WATCHER_LOCAL_WATCHALL: "true"
      WUD_TRIGGER_TELEGRAM_ENERGY_BOTTOKEN: "${WUD_TELEGRAM_BOT_TOKEN:?config/wud.env must define WUD_TELEGRAM_BOT_TOKEN}"
      WUD_TRIGGER_TELEGRAM_ENERGY_CHATID: "${WUD_TELEGRAM_CHAT_ID:?config/wud.env must define WUD_TELEGRAM_CHAT_ID}"
      WUD_TRIGGER_TELEGRAM_ENERGY_MESSAGEFORMAT: HTML
      WUD_TRIGGER_TELEGRAM_ENERGY_MODE: batch
      WUD_TRIGGER_TELEGRAM_ENERGY_THRESHOLD: all
      WUD_TRIGGER_TELEGRAM_ENERGY_ONCE: "true"
      WUD_TRIGGER_TELEGRAM_ENERGY_BATCHTITLE: "energy-host: $${count} update(s)"

volumes:
  wud-energy-store:
